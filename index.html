/* ══ CONSTANTS ══ */
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const REC={diaria:'↻ Diaria',semanal:'↻ Semanal',mensual:'↻ Mensual'};
const PRI={alta:{l:'ALTA',c:'#EF4444'},media:{l:'MEDIA',c:'#E8A020'},baja:{l:'BAJA',c:'#4a5568'}};
const C={bg:'#080c12',surf:'#0d1520',bord:'#1a2535',dim:'#253040',amber:'#E8A020',blue:'#3B82F6',green:'#22C55E',red:'#EF4444',purple:'#A78BFA',text:'#e2e8f4',muted:'#4a5568',faint:'#2a3545'};

/* ══ UTILS ══ */
const pad=n=>String(n).padStart(2,'0');
function todayCtx(){const n=new Date();return{str:`${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`,day:DIAS[n.getDay()]};}
function fmtDate(iso){const d=new Date(iso);return`${pad(d.getDate())} ${MESES[d.getMonth()]} ${d.getFullYear()}`;}
function fmtTime(iso){const d=new Date(iso);return`${pad(d.getHours())}:${pad(d.getMinutes())}`;}
function toHtmlDate(s){if(!s||!/^\d{2}\/\d{2}\/\d{4}$/.test(s))return'';const[d,m,y]=s.split('/');return`${y}-${m}-${d}`;}
function fromHtmlDate(s){if(!s)return null;const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function uid(){return Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function nextDL(rec){const n=new Date();if(rec==='diaria')n.setDate(n.getDate()+1);else if(rec==='semanal')n.setDate(n.getDate()+7);else if(rec==='mensual')n.setMonth(n.getMonth()+1);return`${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`;}
function hasSR(){return !!(window.SpeechRecognition||window.webkitSpeechRecognition);}

/* ══ TOAST ══ */
let toastT=null;

  const t=document.createElement('div');t.className='toast';t.style.borderColor=color+'66';t.style.color=color;t.textContent=text;ct.appendChild(t);

/* ══ SHEETS ══ */
async function sheetsGet(){const r=await fetch(CONFIG.SHEETS_URL+'?v='+Date.now());if(!r.ok)throw new Error('GET '+r.status);return r.json();}
async function sheetsPost(body){const r=await fetch(CONFIG.SHEETS_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify(body)});if(!r.ok)throw new Error('POST '+r.status);return r.json();}
async function loadTasks(){S.loading=true;render();try{const d=await sheetsGet();S.tasks=d.tasks||[];}catch(e){const c=localStorage.getItem('vt-cache');if(c)S.tasks=JSON.parse(c);toast('Sin conexión — cargando caché',C.amber,4000);}S.loading=false;localStorage.setItem('vt-cache',JSON.stringify(S.tasks));if(S.online&&S.offlineQueue.length)await processQueue();render();}
function enqueue(op){S.offlineQueue.push(op);localStorage.setItem('vt-q',JSON.stringify(S.offlineQueue));}
async function processQueue(){if(!S.offlineQueue.length)return;const q=[...S.offlineQueue];S.offlineQueue=[];localStorage.setItem('vt-q','[]');for(const op of q){try{await sheetsPost(op);}catch(e){enqueue(op);}}if(!S.offlineQueue.length)toast('✓ Sincronizado con Google Sheets',C.green,2500);}
async function dbAdd(t){try{await sheetsPost({action:'add',task:t});}catch(e){enqueue({action:'add',task:t});}}
async function dbUpdate(id,t){try{await sheetsPost({action:'update',id,task:t});}catch(e){enqueue({action:'update',id,task:t});}}
async function dbDelete(id){try{await sheetsPost({action:'delete',id});}catch(e){enqueue({action:'delete',id});}}
async function dbBulk(ids){try{await sheetsPost({action:'bulkDelete',ids});}catch(e){enqueue({action:'bulkDelete',ids});}}

/* ══════════════════════════════════════════════════════
   VOZ — Web Speech API (nativa en iPhone Safari + Chrome)
   Sin Whisper, sin HuggingFace, sin CORS, sin costo extra
══════════════════════════════════════════════════════ */
function startVoice(){
  if(S.voiceState!=='idle')return;
  if(!hasSR()){toast('Tu navegador no soporta voz. Usa el modo ⌨ Texto.',C.amber,6000);S.inputType='text';render();return;}

  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recog=new SR();
  recog.lang='es-PE';
  recog.continuous=false;
  recog.interimResults=true;  // ve el texto en tiempo real mientras hablas

  recog.onstart=()=>{
    S.voiceState='listening';S.transcript='';S.interim='';S.showGuide=false;
    toast('🎤 Escuchando… habla ahora',C.amber,0);render();
  };

  recog.onresult=e=>{
    let interim='',final='';
    for(let i=e.resultIndex;i<e.results.length;i++){
      const t=e.results[i][0].transcript;
      if(e.results[i].isFinal)final+=t;else interim+=t;
    }
    if(final)S.transcript=final.trim();
    S.interim=interim;
    render();
  };

  recog.onerror=e=>{
    recog=null;S.voiceState='idle';S.interim='';
    const msgs={'not-allowed':'🔒 Permiso denegado. Sigue la guía abajo.','service-not-allowed':'🔒 En iPhone: Ajustes → Safari → Micrófono → Permitir.','no-speech':'No se detectó voz. Habla más alto.','network':'Error de red al procesar voz.','audio-capture':'No se pudo capturar audio.'};
    if(e.error==='not-allowed'||e.error==='service-not-allowed'){S.micPerm='denied';S.showGuide=true;toast(msgs[e.error],C.red,0);}
    else{toast(msgs[e.error]||('Error: '+e.error),C.red,5000);}
    render();
  };

  recog.onend=()=>{
    const txt=(S.transcript||S.interim||'').trim();
    S.interim='';
    if(!txt){
      recog=null;S.voiceState='idle';
      if(S.micPerm!=='granted'){S.micPerm='denied';S.showGuide=true;toast('🔒 Micrófono bloqueado — sigue la guía',C.red,0);}
      else{toast('No se captó voz. Habla más fuerte.',C.muted,4000);}
      render();return;
    }
    S.micPerm='granted';
    S.voiceState='processing';
    toast('✦ IA organizando…',C.purple,0);render();
    processText(txt).then(()=>{recog=null;});
  };

  try{recog.start();}
  catch(err){S.voiceState='idle';S.micPerm='denied';S.showGuide=true;toast('Error al iniciar micrófono: '+err.message,C.red,0);render();}
}

function stopVoice(){if(recog&&S.voiceState==='listening')recog.stop();}

════════════════════════════════════
PRIORIDAD — guíate así:
════════════════════════════════════

      const gr=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.1,maxOutputTokens:400}})});

/* ══ TASK OPS ══ */
async function toggleDone(id){const t=S.tasks.find(t=>t.id===id);if(!t)return;t.done=!t.done;t.updatedAt=new Date().toISOString();localStorage.setItem('vt-cache',JSON.stringify(S.tasks));render();await dbUpdate(id,{done:t.done,updatedAt:t.updatedAt});}
async function deleteOne(id){if(S.editingId===id){S.editingId=null;S.editDraft={};}S.selectedIds=S.selectedIds.filter(x=>x!==id);S.tasks=S.tasks.filter(t=>t.id!==id);localStorage.setItem('vt-cache',JSON.stringify(S.tasks));render();await dbDelete(id);}
async function renewTask(task){const dl=nextDL(task.recurrence);const now=new Date().toISOString();const nt={...task,id:uid(),done:false,createdAt:now,updatedAt:now,deadline:dl};S.tasks=[nt,...S.tasks];localStorage.setItem('vt-cache',JSON.stringify(S.tasks));render();await dbAdd(nt);toast(`↻ Nueva instancia · límite ${dl}`,C.purple);}
function startEdit(task){S.editingId=task.id;S.editDraft={title:task.title,detail:task.detail||'',category:task.category,type:task.type,priority:task.priority,deadline:task.deadline||null,recurrence:task.recurrence||''};render();}
function cancelEdit(){S.editingId=null;S.editDraft={};render();}
async function saveEdit(id){const d=S.editDraft,t=S.tasks.find(t=>t.id===id);if(!t)return;Object.assign(t,{title:d.title.trim()||t.title,detail:d.detail.trim()||null,category:d.category,type:d.type,priority:d.priority,deadline:d.deadline||null,recurrence:d.recurrence||null,updatedAt:new Date().toISOString()});S.editingId=null;S.editDraft={};localStorage.setItem('vt-cache',JSON.stringify(S.tasks));render();await dbUpdate(id,t);toast('✓ Actualizada',C.green);}
function toggleSel(id){if(S.selectedIds.includes(id))S.selectedIds=S.selectedIds.filter(x=>x!==id);else S.selectedIds=[...S.selectedIds,id];render();}
function startSel(){S.selectMode=true;S.selectedIds=[];S.confirmAction=null;render();}
function endSel(){S.selectMode=false;S.selectedIds=[];S.confirmAction=null;render();}
async function confirmDel(){const ids=S.confirmAction==='completadas'?S.tasks.filter(t=>t.done).map(t=>t.id):[...S.selectedIds];const n=ids.length;S.tasks=S.tasks.filter(t=>!ids.includes(t.id));localStorage.setItem('vt-cache',JSON.stringify(S.tasks));endSel();render();await dbBulk(ids);toast(`🗑 ${n} tareas eliminadas`,C.red,3000);}

/* ══ DOM ══ */
function el(tag,props={},...ch){const e=document.createElement(tag);for(const[k,v]of Object.entries(props)){if(k==='style'&&typeof v==='object')Object.assign(e.style,v);else if(k==='cls')e.className=v;else if(k.startsWith('on')&&typeof v==='function')e.addEventListener(k.slice(2).toLowerCase(),v,{passive:false});else e.setAttribute(k,v);}for(const c of ch.flat(Infinity)){if(c==null||c===false)continue;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(c):c);}return e;}
function chip(t,color){return el('span',{cls:'chip',style:{color,borderColor:color+'44',background:color+'14'}},t);}
function mkSel(opts,val,cb){const s=el('select',{cls:'vt-select',onchange:e=>cb(e.target.value)});opts.forEach(([v,l])=>{const o=el('option',{value:v},l);if(v===val)o.selected=true;s.appendChild(o);});return s;}

/* ══ CARD ══ */
function buildCard(task,accent){
  const pb=PRI[task.priority]||PRI.media;const isEd=S.editingId===task.id;const isSel=S.selectedIds.includes(task.id);
  const cls=['task-card','fadein',isEd?'editing':'',isSel?'selected':'',(task.done&&!isEd&&!S.selectMode)?'done-card':''].filter(Boolean).join(' ');
  const card=el('div',{cls,style:{borderLeftColor:task.done&&!isEd?C.bord:accent}});

  if(S.selectMode&&!isEd){
    card.style.cursor='pointer';card.addEventListener('click',()=>toggleSel(task.id));
    const r=el('div',{style:{display:'flex',gap:'10px',alignItems:'flex-start'}});
    const chk=el('div',{style:{width:'20px',height:'20px',minWidth:'20px',border:`2px solid ${isSel?C.amber:C.faint}`,borderRadius:'4px',background:isSel?C.amber:'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',color:C.bg,flexShrink:'0',marginTop:'2px',transition:'all .12s'}},isSel?'✓':'');
    const info=el('div',{style:{flex:'1',minWidth:'0'}});
    info.appendChild(el('div',{style:{fontSize:'13px',color:C.text,lineHeight:'1.4',wordBreak:'break-word'}},task.title));
    info.appendChild(el('span',{cls:'mono',style:{fontSize:'8px',color:task.category==='trabajo'?C.blue:C.green}},task.category==='trabajo'?'🏭 TRABAJO':'🏠 PERSONAL'));
    r.appendChild(chk);r.appendChild(info);card.appendChild(r);return card;
  }

  if(isEd){
    const d=S.editDraft;
    card.appendChild(el('div',{cls:'mono',style:{fontSize:'8px',color:C.amber,letterSpacing:'.18em',marginBottom:'10px'}},'✎ EDITANDO TAREA'));
    card.appendChild(el('input',{type:'text',value:d.title,cls:'vt-input',placeholder:'Título…',style:{marginBottom:'8px'},oninput:e=>{S.editDraft.title=e.target.value;}}));
    card.appendChild(el('textarea',{cls:'vt-input',placeholder:'Detalle…',style:{marginBottom:'8px',resize:'vertical',minHeight:'48px'},oninput:e=>{S.editDraft.detail=e.target.value;}},d.detail));
    const r1=el('div',{style:{display:'flex',gap:'6px',marginBottom:'8px',flexWrap:'wrap'}});
    r1.appendChild(mkSel([['trabajo','🏭 Trabajo'],['personal','🏠 Personal']],d.category,v=>{S.editDraft.category=v;}));
    r1.appendChild(mkSel([['tarea','Tarea'],['nota','Nota']],d.type,v=>{S.editDraft.type=v;}));
    r1.appendChild(mkSel([['alta','▲ Alta'],['media','● Media'],['baja','▽ Baja']],d.priority,v=>{S.editDraft.priority=v;}));
    r1.appendChild(mkSel([['','Sin recurrencia'],['diaria','↻ Diaria'],['semanal','↻ Semanal'],['mensual','↻ Mensual']],d.recurrence||'',v=>{S.editDraft.recurrence=v||null;}));
    card.appendChild(r1);
    const dlr=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}});
    dlr.appendChild(el('span',{cls:'mono',style:{fontSize:'8px',color:'#60A5FA',whiteSpace:'nowrap',flexShrink:'0'}},'📅 LÍMITE'));
    const dli=el('input',{type:'date',cls:'vt-input',value:toHtmlDate(d.deadline),style:{flex:'1',cursor:'pointer'},onchange:e=>{S.editDraft.deadline=e.target.value?fromHtmlDate(e.target.value):null;}});
    dlr.appendChild(dli);dlr.appendChild(el('button',{cls:'btn btn-dim',onclick:()=>{S.editDraft.deadline=null;dli.value='';render();}},'✕ quitar'));
    card.appendChild(dlr);
    const br=el('div',{style:{display:'flex',gap:'8px',justifyContent:'flex-end'}});
    br.appendChild(el('button',{cls:'btn btn-dim',onclick:cancelEdit},'CANCELAR'));
    br.appendChild(el('button',{cls:'btn btn-amber active',onclick:()=>saveEdit(task.id)},'GUARDAR'));
    card.appendChild(br);return card;
  }

  const row=el('div',{style:{display:'flex',gap:'8px',alignItems:'flex-start'}});
  const cb=el('button',{style:{width:'20px',height:'20px',minWidth:'20px',flexShrink:'0',border:`1px solid ${task.done?'#22C55E':C.faint}`,borderRadius:'3px',background:task.done?'#22C55E22':'transparent',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'12px',color:'#22C55E',marginTop:'2px'},onclick:()=>toggleDone(task.id)},task.done?'✓':'');
  const content=el('div',{style:{flex:'1',minWidth:'0'}});
  content.appendChild(el('div',{style:{fontSize:'13px',color:task.done?C.muted:C.text,textDecoration:task.done?'line-through':'none',lineHeight:'1.4',wordBreak:'break-word'}},task.title));
  if(task.detail)content.appendChild(el('div',{style:{fontSize:'11px',color:C.muted,marginTop:'3px',lineHeight:'1.35'}},task.detail));
  const meta=el('div',{style:{display:'flex',gap:'5px',marginTop:'7px',flexWrap:'wrap',alignItems:'center'}});
  meta.appendChild(chip(task.type==='tarea'?'TAREA':'NOTA',C.muted));
  meta.appendChild(chip(pb.l,pb.c));
  if(task.recurrence)meta.appendChild(chip(REC[task.recurrence],C.purple));
  if(task.deadline)meta.appendChild(chip('📅 '+task.deadline,'#60A5FA'));
  meta.appendChild(el('span',{cls:'mono',style:{fontSize:'7px',color:C.faint}},'·'));
  const ts=el('span',{cls:'mono',style:{fontSize:'7px',color:C.muted}});
  ts.appendChild(el('span',{style:{opacity:'.4'}},'🕐 '));ts.appendChild(document.createTextNode(fmtDate(task.createdAt)+' '+fmtTime(task.createdAt)));meta.appendChild(ts);
  content.appendChild(meta);
  if(task.done&&task.recurrence)content.appendChild(el('button',{cls:'btn',style:{marginTop:'8px',borderColor:C.purple,color:C.purple,background:C.purple+'14'},onclick:()=>renewTask(task)},`↻ Nueva instancia ${(REC[task.recurrence]||'').replace('↻ ','').toLowerCase()}`));
  const act=el('div',{style:{display:'flex',gap:'4px',flexShrink:'0',opacity:'0',transition:'opacity .12s'}});
  act.appendChild(el('button',{cls:'btn btn-amber',style:{padding:'3px 7px'},onclick:()=>startEdit(task)},'✎'));
  act.appendChild(el('button',{cls:'btn btn-red',style:{padding:'3px 7px',opacity:'.7'},onclick:()=>deleteOne(task.id)},'✕'));
  row.appendChild(cb);row.appendChild(content);row.appendChild(act);card.appendChild(row);
  card.addEventListener('mouseenter',()=>{card.style.background=C.surf;act.style.opacity='1';});
  card.addEventListener('mouseleave',()=>{card.style.background='#0b101a';act.style.opacity='0';});
  card.addEventListener('touchstart',()=>{act.style.opacity='1';},{passive:true});
  card.addEventListener('touchend',()=>{setTimeout(()=>{act.style.opacity='0';},2000);},{passive:true});
  return card;
}

/* ══ COLUMN ══ */
function buildCol(title,icon,color,tasks){
  const col=el('div',{style:{borderRight:`1px solid ${C.bord}`,padding:'14px 16px',minHeight:'200px'}});
  const hdr=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:`2px solid ${color}`,paddingBottom:'8px',marginBottom:'12px'}});
  hdr.appendChild(el('span',{cls:'mono',style:{fontSize:'10px',fontWeight:'700',letterSpacing:'.2em',color}},`${icon} ${title}`));
  hdr.appendChild(el('span',{cls:'badge',style:{background:color+'22',color}},tasks.length));
  col.appendChild(hdr);
  if(!tasks.length){const e=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',padding:'32px 0',opacity:'.2'}});e.appendChild(el('div',{style:{fontSize:'28px',marginBottom:'8px'}},'◎'));e.appendChild(el('div',{cls:'mono',style:{fontSize:'9px',letterSpacing:'.12em',color:C.muted}},'SIN TAREAS'));col.appendChild(e);}
  else{const list=el('div',{style:{display:'flex',flexDirection:'column',gap:'8px'}});tasks.forEach(t=>list.appendChild(buildCard(t,color)));col.appendChild(list);}
  return col;
}

/* ══ RENDER ══ */

  if(S.installPrompt){
    const ib=el('div',{cls:'install-banner'});ib.appendChild(el('span',{style:{fontSize:'13px',color:C.text}},'📲 Instala VozTask en tu dispositivo'));

  }

  /* HEADER */
  const hdr=el('div',{cls:'header'});
  const logo=el('div',{style:{display:'flex',alignItems:'center',gap:'10px'}});
  logo.appendChild(el('div',{style:{width:'36px',height:'36px',background:C.amber,borderRadius:'6px',display:'flex',alignItems:'center',justifyContent:'center',fontSize:'18px',fontFamily:'monospace'}},'◈'));
  const lt=el('div');lt.appendChild(el('div',{cls:'mono',style:{fontSize:'17px',fontWeight:'700',color:C.text,letterSpacing:'.04em'}},'VozTask'));lt.appendChild(el('div',{cls:'mono',style:{fontSize:'7px',letterSpacing:'.22em',color:C.muted,textTransform:'uppercase'}},'Captura · IA · Ejecuta'));logo.appendChild(lt);hdr.appendChild(logo);
  const stats=el('div',{style:{display:'flex',gap:'14px'}});
  [{l:'Pendientes',v:pendN,c:C.amber},{l:'Trabajo',v:S.tasks.filter(t=>t.category==='trabajo'&&!t.done).length,c:C.blue},{l:'Personal',v:S.tasks.filter(t=>t.category==='personal'&&!t.done).length,c:C.green},{l:'Listas',v:doneN,c:C.muted}].forEach(s=>{const b=el('div',{style:{textAlign:'center'}});b.appendChild(el('span',{cls:'mono',style:{fontSize:'20px',fontWeight:'700',color:s.c,display:'block',lineHeight:'1'}},s.v));b.appendChild(el('span',{cls:'mono',style:{fontSize:'7px',letterSpacing:'.15em',color:C.muted,textTransform:'uppercase',display:'block',marginTop:'2px'}},s.l));stats.appendChild(b);});
  hdr.appendChild(stats);app.appendChild(hdr);

  if(S.loading){app.appendChild(el('div',{style:{display:'flex',alignItems:'center',justifyContent:'center',height:'300px',fontFamily:'monospace',color:C.amber,letterSpacing:'.15em',fontSize:'13px'}},'CARGANDO…'));return;}

  /* INPUT ZONE */
  const inpZ=el('div',{cls:'input-zone'});
  const topBar=el('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:'14px',flexWrap:'wrap',gap:'8px'}});
  const mg=el('div',{style:{display:'flex',gap:'6px'}});[['ia','✦ IA organiza'],['rapido','⚡ Rápido']].forEach(([v,l])=>{const a=S.mode===v;mg.appendChild(el('button',{cls:`btn ${a?'btn-amber active':'btn-dim'}`,onclick:()=>{S.mode=v;render();}},l));});topBar.appendChild(mg);
  const tg=el('div',{style:{display:'flex',gap:'6px'}});[['voice','🎤 Voz'],['text','⌨ Texto']].forEach(([v,l])=>{const a=S.inputType===v;tg.appendChild(el('button',{cls:`btn ${a?'btn-dim active':'btn-dim'}`,onclick:()=>{S.inputType=v;S.showGuide=false;render();}},l));});topBar.appendChild(tg);inpZ.appendChild(topBar);

  if(S.inputType==='voice'){
    const vc=el('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:'10px'}});
    const denied=S.micPerm==='denied';const mc=denied?C.red:C.amber;
    const micBtn=el('button',{cls:`mic-btn${isListening?' pulse':''}`,style:{borderColor:isListening?mc:busy?C.blue:denied?C.red+'55':C.faint,background:isListening?mc:'transparent',color:isListening?C.bg:busy?C.blue:denied?C.red:mc,fontSize:busy&&!isListening?'22px':'30px',cursor:busy&&!isListening?'default':'pointer'},onclick:isListening?stopVoice:startVoice},isListening?'■':busy?'↻':denied?'🔒':'🎤');

    vc.appendChild(el('div',{cls:'mono',style:{fontSize:'9px',color:isListening?mc:denied?C.red:C.muted,letterSpacing:'.12em',textAlign:'center'}},isListening?'TOCA PARA DETENER':busy?'IA ORGANIZANDO…':denied?'PERMISO REQUERIDO':'TOCA PARA HABLAR'));
    const live=(S.transcript||S.interim||'').trim();
    if(live){const tb=el('div',{cls:'transcript-box'});tb.appendChild(el('div',{cls:'mono',style:{fontSize:'8px',color:C.amber,letterSpacing:'.2em',marginBottom:'5px'}},S.transcript?'ESCUCHADO':'ESCUCHANDO…'));tb.appendChild(el('div',{style:{fontSize:'13px',color:C.text,fontStyle:'italic',lineHeight:'1.4'}},`"${live}"`));vc.appendChild(tb);}
    inpZ.appendChild(vc);

    r1.appendChild(ti);r1.appendChild(el('button',{cls:'btn btn-amber active',style:{padding:'10px 18px',fontSize:'10px'},onclick:submitManual},busy?'…':'AÑADIR'));wrap.appendChild(r1);
    const r2=el('div',{style:{display:'flex',gap:'8px',flexWrap:'wrap'}});
    const dlw=el('div',{style:{display:'flex',alignItems:'center',gap:'8px',background:C.surf,border:`1px solid ${C.bord}`,borderRadius:'6px',padding:'0 12px',flex:'1',minWidth:'150px'}});

    dlw.appendChild(el('input',{type:'date',value:S.manualDeadline,style:{background:'transparent',border:'none',color:C.text,outline:'none',cursor:'pointer',colorScheme:'dark',padding:'10px 0',flex:'1'},onchange:e=>{S.manualDeadline=e.target.value;}}));
    r2.appendChild(dlw);const rs=mkSel([['','Sin recurrencia'],['diaria','↻ Diaria'],['semanal','↻ Semanal'],['mensual','↻ Mensual']],S.manualRec||'',v=>{S.manualRec=v;});rs.style.flex='1';rs.style.minWidth='140px';r2.appendChild(rs);wrap.appendChild(r2);inpZ.appendChild(wrap);
  }
  app.appendChild(inpZ);

  /* FILTER BAR */
  const fb=el('div',{cls:'filter-bar'});
  const fg1=el('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap'}});
  [['pending','Pendientes'],['all','Todas'],['done','Completadas']].forEach(([v,l])=>fg1.appendChild(el('button',{cls:`btn ${S.filter===v?'btn-amber active':'btn-dim'}`,onclick:()=>{S.filter=v;render();}},l)));
  [['both','Ambas'],['trabajo','🏭'],['personal','🏠']].forEach(([v,l])=>fg1.appendChild(el('button',{cls:`btn ${S.view===v?'btn-dim active':'btn-dim'}`,onclick:()=>{S.view=v;render();}},l)));
  fb.appendChild(fg1);
  const fg2=el('div',{style:{display:'flex',gap:'4px',flexWrap:'wrap'}});
  if(!S.selectMode){if(doneN>0)fg2.appendChild(el('button',{cls:'btn btn-red',onclick:()=>{S.confirmAction='completadas';render();}},`🗑 Completadas (${doneN})`));if(S.online&&S.offlineQueue.length)fg2.appendChild(el('button',{cls:'btn btn-amber',onclick:async()=>{await processQueue();await loadTasks();}},`↑ Sync (${S.offlineQueue.length})`));fg2.appendChild(el('button',{cls:'btn btn-dim',onclick:startSel},'☐ Seleccionar'));}
  else{if(S.selectedIds.length)fg2.appendChild(el('button',{cls:'btn btn-red',onclick:()=>{S.confirmAction='seleccionadas';render();}},`🗑 Eliminar (${S.selectedIds.length})`));fg2.appendChild(el('button',{cls:'btn btn-dim',onclick:endSel},'✕ Cancelar'));}
  fb.appendChild(fg2);app.appendChild(fb);

  if(S.confirmAction){

    const cs=el('div',{cls:'confirm-strip'});cs.appendChild(el('span',{cls:'mono',style:{fontSize:'10px',color:C.red}},`⚠ ¿Eliminar ${n} ${S.confirmAction==='completadas'?'tareas completadas':'tareas seleccionadas'}? No se puede deshacer.`));
    const bb=el('div',{style:{display:'flex',gap:'8px'}});bb.appendChild(el('button',{cls:'btn btn-dim',onclick:()=>{S.confirmAction=null;render();}},'CANCELAR'));bb.appendChild(el('button',{cls:'btn btn-red',style:{background:C.red,color:'#fff',border:'none'},onclick:confirmDel},'SÍ, ELIMINAR'));cs.appendChild(bb);app.appendChild(cs);

}

window.addEventListener('online',async()=>{S.online=true;await processQueue();await loadTasks();});
window.addEventListener('offline',()=>{S.online=false;toast('Sin conexión',C.amber,0);render();});

loadTasks();
</script>
