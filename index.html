<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="VozTask">

<title>VozTask</title>
<style>
/* ── RESET & BASE ── */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow-x:hidden}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:#080c12;color:#e2e8f4;
     padding-bottom:env(safe-area-inset-bottom);-webkit-font-smoothing:antialiased}
input,button,select,textarea{font-family:inherit;font-size:16px}
/* prevent iOS zoom on inputs */
input[type=text],input[type=date],select,textarea{font-size:16px}
button{cursor:pointer;-webkit-appearance:none}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:#1e2a38;border-radius:2px}

/* ── ANIMATIONS ── */
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(232,160,32,.5)}60%{box-shadow:0 0 0 16px rgba(232,160,32,0)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@keyframes shimmer{0%{opacity:.7}50%{opacity:1}100%{opacity:.7}}

.pulse{animation:pulse 1.4s ease infinite}
.spin{animation:spin .8s linear infinite}
.fadein{animation:fadein .2s ease}
.shimmer{animation:shimmer 1.5s ease infinite}

/* ── LAYOUT ── */
#app{display:flex;flex-direction:column;min-height:100vh}
.header{background:#0d1520;border-bottom:1px solid #1a2535;padding:12px 16px;
        display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;
        position:sticky;top:0;z-index:10}
.input-zone{background:#0a0f18;border-bottom:1px solid #1a2535;padding:16px}
.filter-bar{background:#0a0f18;border-bottom:1px solid #1a2535;padding:8px 16px;
            display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;align-items:center}
.columns{display:grid;grid-template-columns:1fr 1fr;flex:1}
.columns.single{grid-template-columns:1fr}
@media(max-width:480px){
  .columns{grid-template-columns:1fr!important}
  .stats span{font-size:18px!important}
  .col-tasks{padding:10px!important}
}

/* ── SHARED UI ── */
.mono{font-family:'Courier New','Courier',monospace}
.chip{font-family:'Courier New',monospace;font-size:7px;letter-spacing:.1em;
      border-radius:2px;padding:1px 5px;border:1px solid;display:inline-flex;align-items:center}
.badge{font-family:'Courier New',monospace;font-size:9px;letter-spacing:.08em;
       border-radius:3px;padding:2px 8px}

/* ── INPUTS ── */
.vt-input{background:#0d1520;border:1px solid #1a2535;border-radius:6px;
          padding:10px 14px;color:#e2e8f4;width:100%;color-scheme:dark;
          -webkit-appearance:none;appearance:none}
.vt-input:focus{outline:none;border-color:#E8A02066}
.vt-select{background:#0d1520;border:1px solid #1a2535;border-radius:6px;
           padding:8px 10px;color:#e2e8f4;cursor:pointer;color-scheme:dark;-webkit-appearance:none}
input[type=date].vt-input::-webkit-calendar-picker-indicator{
  filter:invert(.7) sepia(1) saturate(2) hue-rotate(5deg);cursor:pointer;opacity:.8}

/* ── BUTTONS ── */
.btn{display:inline-flex;align-items:center;justify-content:center;
     border-radius:4px;font-family:'Courier New',monospace;font-size:9px;
     letter-spacing:.08em;padding:4px 10px;border:1px solid;cursor:pointer;
     background:transparent;transition:all .15s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.96)}
.btn-amber{border-color:#E8A020;color:#E8A020}
.btn-amber.active{background:#E8A020;color:#080c12;font-weight:700}
.btn-red{border-color:#EF4444;color:#EF4444}
.btn-dim{border-color:#253040;color:#4a5568}
.btn-dim.active{background:#253040;color:#e2e8f4}

/* ── MIC BUTTON ── */
.mic-btn{width:72px;height:72px;border-radius:50%;border:2px solid;
         display:flex;align-items:center;justify-content:center;
         font-size:28px;cursor:pointer;user-select:none;-webkit-user-select:none;
         transition:all .15s;background:transparent;
         -webkit-touch-callout:none;touch-action:none}
.mic-btn:active{transform:scale(.95)}

/* ── CARDS ── */
.task-card{background:#0b101a;border:1px solid #1a2535;border-left:3px solid;
           border-radius:4px;padding:10px;transition:background .12s;position:relative}
.task-card.editing{background:#101828;border-color:#E8A02066}
.task-card.selected{background:#12192a;outline:2px solid #E8A020}
.task-card.done-card{opacity:.45}

/* ── STATUS TOAST ── */
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;
       transform:translateX(-50%);background:#0d1520;border:1px solid;border-radius:8px;
       padding:10px 20px;font-family:'Courier New',monospace;font-size:10px;letter-spacing:.08em;
       z-index:100;max-width:90%;text-align:center;animation:fadein .2s ease;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ── MIC GUIDE ── */
.mic-guide{background:#120d00;border:1px solid #E8A02044;border-radius:8px;
           padding:14px 16px;margin:8px auto 0;max-width:440px;width:100%}
.mic-guide-step{display:flex;gap:8px;margin-bottom:6px;font-size:12px;color:#c8a060;line-height:1.4}
.mic-guide-num{font-family:'Courier New',monospace;font-size:10px;color:#E8A020;
               font-weight:700;min-width:16px;padding-top:1px}

/* ── OFFLINE BANNER ── */
.offline-banner{background:#1a0000;border-bottom:1px solid #EF444444;
                padding:6px 16px;text-align:center;font-family:'Courier New',monospace;
                font-size:9px;letter-spacing:.1em;color:#EF4444}

/* ── INSTALL BANNER ── */
.install-banner{background:#0d1520;border:1px solid #E8A02033;
                padding:10px 16px;display:flex;align-items:center;
                justify-content:space-between;gap:12px}

/* ── CONFIRM STRIP ── */
.confirm-strip{background:#1a0a0a;border-bottom:1px solid #EF444444;
               padding:10px 16px;display:flex;align-items:center;
               justify-content:space-between;flex-wrap:wrap;gap:8px}
</style>
</head>

<!-- ═══════════════════════════════════════════════════════════ -->

<div id="app"></div>
<div id="toast-container"></div>

<script>
/* ════════════════════════════════════════
   CONSTANTS
════════════════════════════════════════ */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const DIAS  = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const REC_LABELS = {diaria:'↻ Diaria', semanal:'↻ Semanal', mensual:'↻ Mensual'};
const PRI   = {alta:{l:'ALTA',c:'#EF4444'}, media:{l:'MEDIA',c:'#E8A020'}, baja:{l:'BAJA',c:'#4a5568'}};
const COLORS = {
  bg:'#080c12', surf:'#0d1520', bord:'#1a2535', dim:'#253040',
  amber:'#E8A020', blue:'#3B82F6', green:'#22C55E', red:'#EF4444', purple:'#A78BFA',
  text:'#e2e8f4', muted:'#4a5568', faint:'#2a3545'
};

/* ════════════════════════════════════════
   STATE
════════════════════════════════════════ */
let S = {
  tasks: [],
  loading: true,
  syncing: false,
  online: navigator.onLine,
  voiceState: 'idle',      // idle | requesting | recording | transcribing | parsing | saving
  transcript: '',
  manualText: '',
  manualDeadline: '',
  manualRec: '',
  mode: 'ia',
  inputType: 'voice',
  micPerm: 'unknown',      // unknown | granted | denied | unavailable
  filter: 'pending',
  view: 'both',
  editingId: null,
  editDraft: {},
  selectMode: false,
  selectedIds: [],
  confirmAction: null,
  offlineQueue: JSON.parse(localStorage.getItem('vt-queue') || '[]'),
  installPrompt: null,
  showMicGuide: false,
};

let mediaRecorder = null;
let audioChunks   = [];
let recogStart    = 0;

/* ════════════════════════════════════════
   UTILITIES
════════════════════════════════════════ */
function todayStr() {
  const n = new Date();
  return `${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`;
}
function todayCtx() {
  const n = new Date();
  return { str: `${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`,
           day: DIAS[n.getDay()] };
}
function pad(n){ return String(n).padStart(2,'0'); }
function fmtDate(iso){ const d=new Date(iso); return `${pad(d.getDate())} ${MESES[d.getMonth()]} ${d.getFullYear()}`; }
function fmtTime(iso){ const d=new Date(iso); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function toHtmlDate(s){ if(!s||!s.match(/^\d{2}\/\d{2}\/\d{4}$/))return''; const[d,m,y]=s.split('/');return`${y}-${m}-${d}`; }
function fromHtmlDate(s){ if(!s)return null; const[y,m,d]=s.split('-');return`${d}/${m}/${y}`; }
function uid(){ return Date.now()+'_'+Math.random().toString(36).slice(2,7); }
function nextDeadline(rec){
  const n=new Date();
  if(rec==='diaria') n.setDate(n.getDate()+1);
  else if(rec==='semanal') n.setDate(n.getDate()+7);
  else if(rec==='mensual') n.setMonth(n.getMonth()+1);
  return `${pad(n.getDate())}/${pad(n.getMonth()+1)}/${n.getFullYear()}`;
}

/* ════════════════════════════════════════
   TOAST
════════════════════════════════════════ */
let toastTimer = null;
function toast(text, color=COLORS.amber, duration=3500) {
  const c = document.getElementById('toast-container');
  if (!c) return;
  c.innerHTML = '';
  if (!text) return;
  const t = document.createElement('div');
  t.className = 'toast';
  t.style.borderColor = color + '66';
  t.style.color = color;
  t.textContent = text;
  c.appendChild(t);
  clearTimeout(toastTimer);
  if (duration) toastTimer = setTimeout(() => { c.innerHTML = ''; }, duration);
}

/* ════════════════════════════════════════
   GOOGLE SHEETS API (via Apps Script)
════════════════════════════════════════ */
async function sheetsGet() {
  const resp = await fetch(CONFIG.SHEETS_URL + '?v=' + Date.now());
  if (!resp.ok) throw new Error('Sheets GET error ' + resp.status);
  return resp.json();
}

async function sheetsPost(body) {
  const resp = await fetch(CONFIG.SHEETS_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
    body: JSON.stringify(body),
  });
  if (!resp.ok) throw new Error('Sheets POST error ' + resp.status);
  return resp.json();
}

async function loadTasks() {
  S.loading = true; render();
  try {
    const data = await sheetsGet();
    S.tasks = data.tasks || [];
    S.loading = false;
    // Process offline queue if online
    if (S.online && S.offlineQueue.length > 0) await processQueue();
  } catch (e) {
    console.error('loadTasks:', e);
    // Fall back to local cache
    const cached = localStorage.getItem('vt-tasks-cache');
    if (cached) S.tasks = JSON.parse(cached);
    S.loading = false;
    toast('Sin conexión — mostrando caché local', COLORS.amber, 4000);
  }
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  render();
}

async function syncAdd(task) {
  try {
    await sheetsPost({ action: 'add', task });
  } catch(e) {
    enqueue({ action: 'add', task });
  }
}

async function syncUpdate(id, task) {
  try {
    await sheetsPost({ action: 'update', id, task });
  } catch(e) {
    enqueue({ action: 'update', id, task });
  }
}

async function syncDelete(id) {
  try {
    await sheetsPost({ action: 'delete', id });
  } catch(e) {
    enqueue({ action: 'delete', id });
  }
}

async function syncBulkDelete(ids) {
  try {
    await sheetsPost({ action: 'bulkDelete', ids });
  } catch(e) {
    enqueue({ action: 'bulkDelete', ids });
  }
}

/* ════════════════════════════════════════
   OFFLINE QUEUE
════════════════════════════════════════ */
function enqueue(op) {
  S.offlineQueue.push(op);
  localStorage.setItem('vt-queue', JSON.stringify(S.offlineQueue));
}

async function processQueue() {
  if (!S.offlineQueue.length) return;
  const q = [...S.offlineQueue];
  S.offlineQueue = [];
  localStorage.setItem('vt-queue', '[]');
  for (const op of q) {
    try {
      await sheetsPost(op);
    } catch(e) {
      enqueue(op); // re-queue if still fails
    }
  }
  if (!S.offlineQueue.length) toast('✓ Sincronizado con Google Sheets', COLORS.green, 2500);
}

/* ════════════════════════════════════════
   VOICE — MediaRecorder + HuggingFace Whisper
   Funciona en iPhone Safari (iOS 14.5+) y Chrome
════════════════════════════════════════ */
async function startVoice() {
  if (S.voiceState !== 'idle') return;
  S.voiceState = 'requesting'; render();

  // 1. Solicitar permiso de micrófono
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    S.micPerm = 'granted';
    S.showMicGuide = false;
  } catch (err) {
    S.voiceState = 'idle';
    if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
      S.micPerm = 'denied';
      S.showMicGuide = true;
      toast('🔒 Permiso de micrófono denegado — sigue la guía abajo', COLORS.red, 0);
    } else if (err.name === 'NotFoundError') {
      S.micPerm = 'unavailable';
      toast('🎤 No se encontró micrófono en este dispositivo', COLORS.red, 5000);
    } else {
      toast('Error de micrófono: ' + err.message, COLORS.red, 5000);
    }
    render(); return;
  }

  // 2. Iniciar grabación
  const mimeType = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
    : MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm'
    : 'audio/mp4'; // iOS Safari

  audioChunks = [];
  mediaRecorder = new MediaRecorder(stream, { mimeType });
  mediaRecorder.ondataavailable = e => { if (e.data.size > 0) audioChunks.push(e.data); };
  mediaRecorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    const blob = new Blob(audioChunks, { type: mimeType });
    await transcribeAndProcess(blob);
  };

  recogStart = Date.now();
  mediaRecorder.start(250); // collect every 250ms
  S.voiceState = 'recording'; S.transcript = '';
  toast('🎤 Grabando… toca de nuevo para detener', COLORS.amber, 0);
  render();
}

function stopVoice() {
  if (mediaRecorder && mediaRecorder.state !== 'inactive') {
    const elapsed = Date.now() - recogStart;
    if (elapsed < 500) {
      toast('Habla por al menos 1 segundo', COLORS.muted, 3000);
      mediaRecorder.stop(); S.voiceState = 'idle'; render(); return;
    }
    S.voiceState = 'transcribing';
    toast('⟳ Transcribiendo con Whisper…', COLORS.blue, 0);
    render();
    mediaRecorder.stop();
  }
}

async function transcribeAndProcess(blob) {
  // 3. Transcribir con HuggingFace Whisper
  let text = '';
  try {
    const hfResp = await fetch(
      `https://api-inference.huggingface.co/models/${CONFIG.WHISPER_MODEL}`,
      {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${CONFIG.HF_TOKEN}`,
          'Content-Type': blob.type,
        },
        body: blob,
      }
    );

    if (hfResp.status === 503) {
      // Model loading — retry once after 12s
      toast('⟳ Cargando modelo Whisper (12s)…', COLORS.amber, 0);
      await new Promise(r => setTimeout(r, 12000));
      return transcribeAndProcess(blob);
    }

    if (!hfResp.ok) {
      const err = await hfResp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${hfResp.status}`);
    }

    const result = await hfResp.json();
    text = result.text || result[0]?.text || '';
    text = text.trim();

    if (!text) {
      S.voiceState = 'idle'; render();
      toast('No se detectó voz. Habla más cerca del micrófono.', COLORS.muted, 4000);
      return;
    }

    S.transcript = text; render();
  } catch(e) {
    S.voiceState = 'idle'; render();
    toast('Error Whisper: ' + e.message, COLORS.red, 6000);
    return;
  }

  // 4. Parsear con Gemini
  S.voiceState = 'parsing';
  toast('✦ IA organizando…', COLORS.purple, 0);
  render();
  await processText(text);
}

/* ════════════════════════════════════════
   AI — Gemini 1.5 Flash (gratis)
════════════════════════════════════════ */
async function processText(text, forcedDeadline=null, forcedRec=null) {
  const { str: today, day } = todayCtx();
  let parsed = null;

  if (S.mode === 'ia') {
    try {
      const prompt = `Hoy es ${today} (${day}). Eres el asistente de Carlos Rojas, Jefe de Laboratorio de Refinería La Pampilla, Lima, Perú.
Analiza el texto y extrae info. Responde SOLO JSON sin markdown.
{"title":"título conciso máx 75 chars","detail":"detalle o null","category":"trabajo"|"personal","type":"tarea"|"nota","priority":"alta"|"media"|"baja","deadline":"DD/MM/YYYY"|null,"recurrence":"diaria"|"semanal"|"mensual"|null}
FECHA LÍMITE (CRÍTICO): Si el texto menciona CUALQUIER referencia temporal futura (mañana, viernes, 5 de mayo, próxima semana, en 3 días…) conviértela a DD/MM/YYYY usando ${today} como hoy. NUNCA null si hay fecha.
RECURRENCIA: solo si menciona periodicidad explícita (todos los días, cada semana, mensualmente, etc.).
Trabajo=laboratorio,calibración,LIMS,ISO,SUNAT,OSINERGMIN,refinería,muestras,equipos,reportes.
Personal=familia,médico,compras,hogar,universidad,postgrado,ocio.
Texto: "${text}"`;

      const gResp = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${CONFIG.GEMINI_KEY}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            contents: [{ parts: [{ text: prompt }] }],
            generationConfig: { temperature: 0.1, maxOutputTokens: 400 }
          })
        }
      );

      if (!gResp.ok) throw new Error('Gemini HTTP ' + gResp.status);
      const gData = await gResp.json();
      const raw = gData.candidates?.[0]?.content?.parts?.[0]?.text || '{}';
      const m = raw.match(/\{[\s\S]*\}/);
      parsed = JSON.parse(m ? m[0] : '{}');
    } catch(e) {
      console.warn('Gemini error:', e);
      parsed = null; // fall through to basic save
    }
  }

  // Build task
  const now = new Date().toISOString();
  const task = {
    id:         uid(),
    title:      parsed?.title || text.slice(0,75),
    detail:     (parsed?.detail && parsed.detail !== 'null') ? parsed.detail : null,
    category:   parsed?.category || 'trabajo',
    type:       parsed?.type || 'tarea',
    priority:   parsed?.priority || 'media',
    deadline:   forcedDeadline || (parsed?.deadline && parsed.deadline !== 'null' ? parsed.deadline : null),
    recurrence: forcedRec || (parsed?.recurrence && parsed.recurrence !== 'null' ? parsed.recurrence : null),
    done:       false,
    createdAt:  now,
    updatedAt:  now,
  };

  // Save locally first
  S.tasks = [task, ...S.tasks];
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  S.voiceState = 'saving'; render();

  // Sync to Sheets
  S.voiceState = 'idle'; S.transcript = ''; S.manualText = ''; S.manualDeadline = ''; S.manualRec = '';
  await syncAdd(task);

  const parts = [`✓ ${task.category} · ${task.priority}`];
  if (task.deadline) parts.push(`📅 ${task.deadline}`);
  if (task.recurrence) parts.push(REC_LABELS[task.recurrence]);
  toast(parts.join(' · '), COLORS.green);
  render();
}

async function submitManual() {
  const text = S.manualText.trim();
  if (!text || S.voiceState !== 'idle') return;
  const fd = S.manualDeadline ? fromHtmlDate(S.manualDeadline) : null;
  const fr = S.manualRec || null;
  S.voiceState = 'parsing';
  toast('✦ IA organizando…', COLORS.purple, 0);
  render();
  await processText(text, fd, fr);
}

/* ════════════════════════════════════════
   TASK OPERATIONS
════════════════════════════════════════ */
async function toggleDone(id) {
  const task = S.tasks.find(t => t.id === id);
  if (!task) return;
  task.done = !task.done;
  task.updatedAt = new Date().toISOString();
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  render();
  await syncUpdate(id, { done: task.done, updatedAt: task.updatedAt });
}

async function deleteOne(id) {
  if (S.editingId === id) { S.editingId = null; S.editDraft = {}; }
  S.selectedIds = S.selectedIds.filter(x => x !== id);
  S.tasks = S.tasks.filter(t => t.id !== id);
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  render();
  await syncDelete(id);
}

async function renewTask(task) {
  const deadline = nextDeadline(task.recurrence);
  const now = new Date().toISOString();
  const nt = { ...task, id: uid(), done: false, createdAt: now, updatedAt: now, deadline };
  S.tasks = [nt, ...S.tasks];
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  render();
  await syncAdd(nt);
  toast(`↻ Nueva instancia · límite ${deadline}`, COLORS.purple);
}

function startEdit(task) {
  S.editingId = task.id;
  S.editDraft = {
    title: task.title, detail: task.detail || '', category: task.category,
    type: task.type, priority: task.priority,
    deadline: task.deadline || null, recurrence: task.recurrence || ''
  };
  render();
}
function cancelEdit() { S.editingId = null; S.editDraft = {}; render(); }

async function saveEdit(id) {
  const d = S.editDraft;
  const task = S.tasks.find(t => t.id === id);
  if (!task) return;
  Object.assign(task, {
    title: d.title.trim() || task.title,
    detail: d.detail.trim() || null,
    category: d.category, type: d.type, priority: d.priority,
    deadline: d.deadline || null,
    recurrence: d.recurrence || null,
    updatedAt: new Date().toISOString()
  });
  S.editingId = null; S.editDraft = {};
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  render();
  await syncUpdate(id, task);
  toast('✓ Tarea actualizada', COLORS.green);
}

function toggleSelect(id) {
  if (S.selectedIds.includes(id)) S.selectedIds = S.selectedIds.filter(x => x !== id);
  else S.selectedIds = [...S.selectedIds, id];
  render();
}
function startSelectMode() { S.selectMode = true; S.selectedIds = []; S.confirmAction = null; render(); }
function endSelectMode() { S.selectMode = false; S.selectedIds = []; S.confirmAction = null; render(); }

async function confirmDelete() {
  const ids = S.confirmAction === 'completadas'
    ? S.tasks.filter(t => t.done).map(t => t.id)
    : [...S.selectedIds];
  const n = ids.length;
  S.tasks = S.tasks.filter(t => !ids.includes(t.id));
  localStorage.setItem('vt-tasks-cache', JSON.stringify(S.tasks));
  endSelectMode();
  render();
  await syncBulkDelete(ids);
  toast(`🗑 ${n} tareas eliminadas`, COLORS.red, 3000);
}

/* ════════════════════════════════════════
   DOM HELPERS
════════════════════════════════════════ */
function el(tag, props={}, ...children) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(props)) {
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k === 'cls') e.className = v;
    else if (k.startsWith('on') && typeof v === 'function') e.addEventListener(k.slice(2).toLowerCase(), v, {passive: false});
    else e.setAttribute(k, v);
  }
  for (const c of children.flat(Infinity)) {
    if (c == null || c === false) continue;
    e.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(c) : c);
  }
  return e;
}
function chip(text, color, bg) {
  return el('span', {cls:'chip', style:{color,borderColor:color+'44',background:bg||color+'14'}}, text);
}

  const card = el('div', {cls:clsList,
    style:{borderLeftColor: task.done && !isEditing ? COLORS.bord : accent}
  });

  /* ── SELECT MODE ── */
  if (S.selectMode && !isEditing) {
    card.style.cursor = 'pointer';
    card.addEventListener('click', () => toggleSelect(task.id));
    const row = el('div', {style:{display:'flex',gap:'10px',alignItems:'flex-start'}});
    const chk = el('div', {style:{
      width:'20px',height:'20px',minWidth:'20px',
      border:`2px solid ${isSelected ? COLORS.amber : COLORS.faint}`,
      borderRadius:'4px',background:isSelected?COLORS.amber:'transparent',
      display:'flex',alignItems:'center',justifyContent:'center',
      fontSize:'12px',color:COLORS.bg,flexShrink:'0',transition:'all .12s',marginTop:'2px'
    }}, isSelected ? '✓' : '');

    info.appendChild(el('span', {cls:'mono', style:{fontSize:'9px',color:task.category==='trabajo'?COLORS.blue:COLORS.green,letterSpacing:'.08em'}},
      task.category==='trabajo' ? '🏭 TRABAJO' : '🏠 PERSONAL'));
    row.appendChild(chk); row.appendChild(info); card.appendChild(row);
    return card;
  }

  /* ── EDIT MODE ── */
  if (isEditing) {
    const d = S.editDraft;
    card.appendChild(el('div', {cls:'mono', style:{fontSize:'8px',color:COLORS.amber,letterSpacing:'.18em',marginBottom:'10px'}}, '✎ EDITANDO TAREA'));

    const titleIn = el('input', {type:'text', value:d.title, cls:'vt-input', placeholder:'Título…',
      style:{marginBottom:'8px'}, oninput: e=>{ S.editDraft.title = e.target.value; }});
    card.appendChild(titleIn);

    const detailIn = el('textarea', {cls:'vt-input', placeholder:'Detalle adicional…',
      style:{marginBottom:'8px',resize:'vertical',minHeight:'50px'},
      oninput: e=>{ S.editDraft.detail = e.target.value; }}, d.detail);
    card.appendChild(detailIn);

    const r1 = el('div', {style:{display:'flex',gap:'6px',marginBottom:'8px',flexWrap:'wrap'}});
    const mkSel = (opts, val, cb) => {
      const s = el('select', {cls:'vt-select', onchange:e=>cb(e.target.value)});
      opts.forEach(([v,l]) => { const o = el('option', {value:v}, l); if(v===val) o.selected=true; s.appendChild(o); });
      return s;
    };
    r1.appendChild(mkSel([['trabajo','🏭 Trabajo'],['personal','🏠 Personal']], d.category, v=>{ S.editDraft.category=v; }));
    r1.appendChild(mkSel([['tarea','Tarea'],['nota','Nota']], d.type, v=>{ S.editDraft.type=v; }));
    r1.appendChild(mkSel([['alta','▲ Alta'],['media','● Media'],['baja','▽ Baja']], d.priority, v=>{ S.editDraft.priority=v; }));
    r1.appendChild(mkSel([['','Sin recurrencia'],['diaria','↻ Diaria'],['semanal','↻ Semanal'],['mensual','↻ Mensual']], d.recurrence||'', v=>{ S.editDraft.recurrence=v||null; }));
    card.appendChild(r1);

    // Deadline with date picker
    const dlRow = el('div', {style:{display:'flex',alignItems:'center',gap:'8px',marginBottom:'10px'}});
    dlRow.appendChild(el('span', {cls:'mono', style:{fontSize:'8px',color:'#60A5FA',letterSpacing:'.1em',whiteSpace:'nowrap',flexShrink:'0'}}, '📅 LÍMITE'));
    const dlIn = el('input', {type:'date', cls:'vt-input', value:toHtmlDate(d.deadline),
      style:{flex:'1',cursor:'pointer'},
      onchange: e=>{ S.editDraft.deadline = e.target.value ? fromHtmlDate(e.target.value) : null; }});
    const dlClr = el('button', {cls:'btn btn-dim', style:{whiteSpace:'nowrap'},
      onclick: ()=>{ S.editDraft.deadline=null; dlIn.value=''; render(); }}, '✕ quitar');
    dlRow.appendChild(dlIn); dlRow.appendChild(dlClr);
    card.appendChild(dlRow);

    btns.appendChild(el('button', {cls:'btn btn-amber active', onclick:()=>saveEdit(task.id)}, 'GUARDAR'));
    card.appendChild(btns);
    return card;
  }

  /* ── VIEW MODE ── */
  const row = el('div', {style:{display:'flex',gap:'8px',alignItems:'flex-start'}});

  // Checkbox
  const cb = el('button', {
    style:{width:'20px',height:'20px',minWidth:'20px',flexShrink:'0',
           border:`1px solid ${task.done?'#22C55E':COLORS.faint}`,borderRadius:'3px',
           background:task.done?'#22C55E22':'transparent',display:'flex',alignItems:'center',
           justifyContent:'center',fontSize:'12px',color:'#22C55E',marginTop:'2px'},
    onclick:()=>toggleDone(task.id)
  }, task.done ? '✓' : '');

  // Content
  const content = el('div', {style:{flex:'1',minWidth:'0'}});
  content.appendChild(el('div', {
    style:{fontSize:'13px',color:task.done?COLORS.muted:COLORS.text,
           textDecoration:task.done?'line-through':'none',lineHeight:'1.4',wordBreak:'break-word'}

  if (task.detail) {
    content.appendChild(el('div', {style:{fontSize:'11px',color:COLORS.muted,marginTop:'3px',lineHeight:'1.35'}}, task.detail));
  }

  // Meta chips
  const meta = el('div', {style:{display:'flex',gap:'5px',marginTop:'7px',flexWrap:'wrap',alignItems:'center'}});
  meta.appendChild(chip(task.type==='tarea'?'TAREA':'NOTA', COLORS.muted));

  meta.appendChild(el('span', {cls:'mono', style:{fontSize:'7px',color:COLORS.faint}}, '·'));
  const ts = el('span', {cls:'mono', style:{fontSize:'7px',color:COLORS.muted}});
  ts.appendChild(el('span', {style:{opacity:'.4'}}, '🕐 '));
  ts.appendChild(document.createTextNode(fmtDate(task.createdAt)+' '+fmtTime(task.createdAt)));
  meta.appendChild(ts);
  content.appendChild(meta);

  // Renew button for completed recurring
  if (task.done && task.recurrence) {
    const rb = el('button', {
      cls:'btn', style:{marginTop:'8px',borderColor:COLORS.purple,color:COLORS.purple,background:COLORS.purple+'14'},
      onclick:()=>renewTask(task)
    }, `↻ Nueva instancia ${(REC_LABELS[task.recurrence]||'').replace('↻ ','').toLowerCase()}`);
    content.appendChild(rb);
  }

  // Action buttons (hover/touch)
  const actions = el('div', {style:{display:'flex',gap:'4px',flexShrink:'0',opacity:'0',transition:'opacity .12s'}});
  actions.appendChild(el('button', {cls:'btn btn-amber', style:{padding:'3px 7px'},
    onclick:()=>startEdit(task)}, '✎'));
  actions.appendChild(el('button', {cls:'btn btn-red', style:{padding:'3px 7px',opacity:'.7'},
    onclick:()=>deleteOne(task.id)}, '✕'));

  row.appendChild(cb); row.appendChild(content); row.appendChild(actions);
  card.appendChild(row);

  card.addEventListener('mouseenter', () => { card.style.background=COLORS.surf; actions.style.opacity='1'; });
  card.addEventListener('mouseleave', () => { card.style.background='#0b101a'; actions.style.opacity='0'; });
  // Touch: show actions briefly on touch
  card.addEventListener('touchstart', () => { actions.style.opacity='1'; }, {passive:true});
  card.addEventListener('touchend', () => { setTimeout(()=>{ actions.style.opacity='0'; }, 2000); }, {passive:true});

  return card;
}

function buildColumn(title, icon, color, tasks) {

  const hdr = el('div', {style:{display:'flex',justifyContent:'space-between',alignItems:'center',borderBottom:`2px solid ${color}`,paddingBottom:'8px',marginBottom:'12px'}});

  if (!tasks.length) {
    const empty = el('div', {style:{display:'flex',flexDirection:'column',alignItems:'center',padding:'32px 0',opacity:'.2'}});

  /* ── FILTER BAR ── */
  const fb = el('div', {cls:'filter-bar'});
  const fg1 = el('div', {style:{display:'flex',gap:'4px',flexWrap:'wrap'}});
  [['pending','Pendientes'],['all','Todas'],['done','Completadas']].forEach(([v,l])=>{
    fg1.appendChild(el('button',{cls:`btn ${S.filter===v?'btn-amber active':'btn-dim'}`,onclick:()=>{S.filter=v;render();}},l));
  });
  [['both','Ambas'],['trabajo','🏭'],['personal','🏠']].forEach(([v,l])=>{
    fg1.appendChild(el('button',{cls:`btn ${S.view===v?'btn-dim active':'btn-dim'}`,onclick:()=>{S.view=v;render();}},l));
  });
  fb.appendChild(fg1);

  const fg2 = el('div', {style:{display:'flex',gap:'4px',flexWrap:'wrap'}});
  if (!S.selectMode) {
    if (doneTotal > 0) fg2.appendChild(el('button',{cls:'btn btn-red',onclick:()=>{S.confirmAction='completadas';render();}},`🗑 Completadas (${doneTotal})`));
    if (S.online && S.offlineQueue.length > 0) fg2.appendChild(el('button',{cls:'btn',style:{borderColor:COLORS.amber,color:COLORS.amber},onclick:async()=>{await processQueue();await loadTasks();}},`↑ Sincronizar (${S.offlineQueue.length})`));
    fg2.appendChild(el('button',{cls:'btn btn-dim',onclick:startSelectMode},'☐ Seleccionar'));
  } else {
    if (S.selectedIds.length > 0) fg2.appendChild(el('button',{cls:'btn btn-red',onclick:()=>{S.confirmAction='seleccionadas';render();}},`🗑 Eliminar (${S.selectedIds.length})`));
    fg2.appendChild(el('button',{cls:'btn btn-dim',onclick:endSelectMode},'✕ Cancelar'));
  }
  fb.appendChild(fg2); app.appendChild(fb);

  /* ── CONFIRM STRIP ── */
  if (S.confirmAction) {
    const n = S.confirmAction==='completadas' ? doneTotal : S.selectedIds.length;
    const label = S.confirmAction==='completadas' ? `${n} tareas completadas` : `${n} tareas seleccionadas`;
    const strip = el('div', {cls:'confirm-strip'});
    strip.appendChild(el('span',{cls:'mono',style:{fontSize:'10px',color:COLORS.red}},`⚠ ¿Eliminar ${label}? No se puede deshacer.`));
    const bb = el('div',{style:{display:'flex',gap:'8px'}});
    bb.appendChild(el('button',{cls:'btn btn-dim',onclick:()=>{S.confirmAction=null;render();}},'CANCELAR'));
    bb.appendChild(el('button',{cls:'btn btn-red',style:{background:COLORS.red,color:'#fff',border:'none'},onclick:confirmDelete},'SÍ, ELIMINAR'));
    strip.appendChild(bb); app.appendChild(strip);
  }

  /* ── COLUMNS ── */
  const cols = el('div', {cls:`columns${S.view!=='both'?' single':''}`});
  const showWork = S.view==='both' || S.view==='trabajo';
  const showPers = S.view==='both' || S.view==='personal';
  const colWork = showWork ? (S.view==='both' ? workList : filtered.filter(t=>t.category==='trabajo')) : [];
  const colPers = showPers ? (S.view==='both' ? persList : filtered.filter(t=>t.category==='personal')) : [];
  if (showWork) cols.appendChild(buildColumn('TRABAJO','🏭',COLORS.blue,colWork));
  if (showPers) cols.appendChild(buildColumn('PERSONAL','🏠',COLORS.green,colPers));
  app.appendChild(cols);
}

/* ════════════════════════════════════════
   PWA — Service Worker + Install Prompt
════════════════════════════════════════ */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(e => console.warn('SW:', e));
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  S.installPrompt = e;
  render();
});

window.addEventListener('online',  async () => { S.online=true; await processQueue(); await loadTasks(); });
window.addEventListener('offline', () => { S.online=false; toast('Sin conexión — modo offline', COLORS.amber, 0); render(); });

/* ════════════════════════════════════════
   INIT
════════════════════════════════════════ */
loadTasks();
</script>
</body>
</html>
